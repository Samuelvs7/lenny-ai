server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves users on stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Defence in depth for the app shell. The artifact iframe carries its own,
    # stricter CSP (see backend/app/skills/artifact_safety.py); this policy
    # governs the application itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
